<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Gas Saya</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card-master { border-radius: 15px; border: none; transition: transform 0.2s; }
    .card-master:hover { transform: translateY(-5px); }
    .header-primary { background: linear-gradient(135deg, #007bff, #0056b3); color: white; border-top-left-radius: 15px; border-top-right-radius: 15px; }
    .form-control, .form-select { border-radius: 10px; border: 1px solid #ced4da; padding: 10px; }
    .form-control:focus, .form-select:focus { border-color: #007bff; box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25); }
    .badge-price { font-size: 1.1rem; }
  </style>
</head>
<body>

  <div class="container mt-5">
    <h2 class="text-center text-primary mb-4 fw-bold">Sistem Management Gas</h2>

    <div class="row mb-5">
      <div class="col-md-10 offset-md-1">
        <div class="card card-master shadow-lg">
          <div class="card-header header-primary text-center py-3">
            <h4 class="mb-0 fw-bold"><i class="fas fa-plus-circle me-2"></i>Transaksi Jualan Gas</h4>
          </div>
          <div class="card-body p-4 bg-white">
            <form id="formTransaksi">
              <div class="row mb-3">
                <div class="col-md-6 mb-3 mb-md-0">
                  <label for="tanggalWaktu" class="form-label fw-bold text-secondary">Tanggal/Waktu</label>
                  <input type="datetime-local" class="form-control" id="tanggalWaktu" required readonly>
                </div>
                <div class="col-md-6">
                  <label for="idTransaksi" class="form-label fw-bold text-secondary">ID Transaksi</label>
                  <input type="text" class="form-control" id="idTransaksi" required readonly>
                </div>
              </div>

              <div class="mb-3">
                <label for="namaPelanggan" class="form-label fw-bold text-secondary">Pilih Pelanggan</label>
                <select class="form-select form-select-lg" id="namaPelanggan" required>
                  <option value="">Pilih Pelanggan...</option>
                  </select>
              </div>

              <div class="row mb-3">
                <div class="col-md-6 mb-3 mb-md-0">
                  <label for="hargaTabung" class="form-label fw-bold text-secondary">Harga/Tabung (Rp)</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light">Rp</span>
                    <input type="number" class="form-control" id="hargaTabung" readonly required>
                  </div>
                </div>
                <div class="col-md-6">
                  <label for="gasBeli" class="form-label fw-bold text-secondary">Gas Beli (Tabung)</label>
                  <input type="number" class="form-control form-control-lg" id="gasBeli" required min="1">
                </div>
              </div>

              <div class="row mb-3">
                <div class="col-md-6 mb-3 mb-md-0">
                  <label for="tabungKembali" class="form-label fw-bold text-secondary">Tabung Kembali (Kosong)</label>
                  <input type="number" class="form-control" id="tabungKembali" required min="0">
                </div>
                <div class="col-md-6">
                  <label for="totalTagihan" class="form-label fw-bold text-success fw-bold">Total Tagihan (Rp)</label>
                  <div class="input-group">
                    <span class="input-group-text bg-success text-white badge-price">Rp</span>
                    <input type="number" class="form-control form-control-lg border-success text-success fw-bold" id="totalTagihan" readonly>
                  </div>
                </div>
              </div>

              <div class="row mb-4">
                <div class="col-md-6 mb-3 mb-md-0">
                  <label for="uangBayar" class="form-label fw-bold text-secondary">Uang Bayar (Rp)</label>
                  <div class="input-group input-group-lg">
                    <span class="input-group-text bg-light">Rp</span>
                    <input type="number" class="form-control fw-bold" id="uangBayar" required min="0">
                  </div>
                </div>
                <div class="col-md-6">
                  <label for="hutangUang" class="form-label fw-bold text-danger">Hutang Uang (Rp)</label>
                  <div class="input-group input-group-lg">
                    <span class="input-group-text bg-danger text-white">Rp</span>
                    <input type="number" class="form-control text-danger fw-bold border-danger" id="hutangUang" readonly>
                  </div>
                </div>
              </div>

              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-success btn-lg px-5 py-3 fw-bold"><i class="fas fa-save me-2"></i>Simpan Transaksi & Cetak Nota</button>
                <button type="button" id="btnBatal" class="btn btn-outline-secondary btn-lg"><i class="fas fa-times me-2"></i>Batal</button>
              </div>
            </form>
            
            <div id="statusTransaksi" class="mt-3 text-center d-none"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="text-center mb-4">
      <h4 class="text-muted mb-3 fw-bold"><i class="fas fa-address-book me-2"></i>Daftar Pelanggan Aktif</h4>
      <button id="btnLoad" class="btn btn-outline-primary btn-lg px-4"><i class="fas fa-sync me-2"></i>Muat Ulang Database Pelanggan</button>
    </div>
    <div id="hasilData" class="mt-4 row"></div>
  </div>

  <script>
    // 1. MASUKKAN LINK URL APPS SCRIPT ANDA DI BAWAH INI:
    const API_URL = "https://script.google.com/macros/s/AKfycbzE8T0osCFVPnxtU7p_Jt84UHydBun3hlV4tgm44Whbk_Xhmv7PGXRjE4b2oM63PV2SsA/exec"; 

    // Variabel global untuk menyimpan data pelanggan
    let customersData = [];
    let nextTransactionIdSuffix = localStorage.getItem('gas_next_tx_id') || 1001;

    // *** Fungsi untuk Menyiapkan Form (Auto ID & Tanggal) ***
    function resetForm() {
      document.getElementById('formTransaksi').reset();
      
      // Auto Date: Set format tanggal ke 'datetime-local' (iPad kompatibel)
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById('tanggalWaktu').value = now.toISOString().slice(0, 16);
      
      // Auto ID: TX_YYYYMMDD_XXXX
      const dateStr = now.toISOString().slice(0, 10).replace(/-/g, '');
      const transactionId = `TX_${dateStr}_${nextTransactionIdSuffix}`;
      document.getElementById('idTransaksi').value = transactionId;
      
      document.getElementById('statusTransaksi').classList.add('d-none');
    }

    // Jalankan reset form saat halaman dimuat pertama kali
    resetForm();

    // *** Fungsi-Fungsi Auto-Perhitungan JavaScript (Tampilan Keren/RQ Kamila Style) ***

    // 1. Ketika Pelanggan dipilih: Tarik Harga Khusus otomatis
    document.getElementById('namaPelanggan').addEventListener('change', function(e) {
      const selectedCustomerId = e.target.value;
      const selectedCustomer = customersData.find(c => c.Nama_Pelanggan === selectedCustomerId);
      if (selectedCustomer) {
        document.getElementById('hargaTabung').value = selectedCustomer.Harga_Khusus || 0;
      } else {
        document.getElementById('hargaTabung').value = '';
      }
      calculateTotals();
    });

    // 2. Ketika jumlah tabung atau uang bayar diketik: Hitung otomatis
    document.querySelectorAll('#gasBeli, # tabungKembali, #uangBayar').forEach(input => {
      input.addEventListener('input', calculateTotals);
    });

    function calculateTotals() {
      const price = parseFloat(document.getElementById('hargaTabung').value) || 0;
      const numGasBeli = parseInt(document.getElementById('gasBeli').value) || 0;
      const payment = parseFloat(document.getElementById('uangBayar').value) || 0;

      // Hitung Total Tagihan: Harga * Gas Beli
      const totalBill = price * numGasBeli;
      document.getElementById('totalTagihan').value = totalBill.toFixed(0);

      // Hitung Hutang Uang: Total - Uang Bayar
      const debtUang = totalBill - payment;
      document.getElementById('hutangUang').value = debtUang.toFixed(0);
    }

    // *** Bagian 2: Muat Database Pelanggan & Populasikan Form ***
    document.getElementById("btnLoad").addEventListener("click", function() {
      const hasilDiv = document.getElementById("hasilData");
      hasilDiv.innerHTML = "<p class='text-center text-warning'><i class='fas fa-circle-notch fa-spin me-2'></i>Menghubungkan ke Database...</p>";

      // Mengambil data dari Google Sheets
      fetch(API_URL + "?sheet=Pelanggan")
        .then(response => response.json())
        .then(data => {
          if(data.status === "success") {
            customersData = data.data; // Simpan secara global
            
            // Populasikan Select Dropdown di Form
            const customerSelect = document.getElementById('namaPelanggan');
            customerSelect.innerHTML = '<option value="">Pilih Pelanggan...</option>';
            customersData.forEach(pelanggan => {
              if (pelanggan.Nama_Pelanggan) {
                const option = document.createElement('option');
                option.value = pelanggan.Nama_Pelanggan;
                option.textContent = pelanggan.Nama_Pelanggan;
                customerSelect.appendChild(option);
              }
            });

            // Tetap Munculkan Kartu Pelanggan di Bawah (Pemesanan di AppSheet)
            let htmlContent = "";
            data.data.forEach(pelanggan => {
              htmlContent += `
                <div class="col-md-4 mb-4">
                  <div class="card card-master border-primary shadow h-100">
                    <div class="card-body">
                      <h5 class="card-title text-primary fw-bold">${pelanggan.Nama_Pelanggan || 'Tanpa Nama'}</h5>
                      <p class="card-text mb-1 text-muted"><small><i class="fas fa-tag me-2"></i>Kategori: <b>${pelanggan.Katagori || '-'}</b></small></p>
                      <h6 class="card-text text-dark"><i class="fas fa-money-bill-wave me-2"></i>Rp${pelanggan.Harga_Khusus || '-'}</h6>
                    </div>
                  </div>
                </div>
              `;
            });
            hasilDiv.innerHTML = htmlContent;
          } else {
            hasilDiv.innerHTML = "<p class='text-center text-danger'>Gagal memuat data pelanggan.</p>";
          }
        })
        .catch(error => {
          hasilDiv.innerHTML = "<p class='text-center text-danger'>Terjadi kesalahan koneksi database.</p>";
        });
    });

    // *** Bagian 3: Kirim Data Transaksi Baru (Simpan ke Google Sheets) ***
    document.getElementById('formTransaksi').addEventListener('submit', function(e) {
      e.preventDefault(); // Mencegah reload halaman
      
      const statusDiv = document.getElementById('statusTransaksi');
      statusDiv.innerHTML = '<div class="spinner-border spinner-border-sm text-warning"></div><span class="ms-2">Menyimpan transaksi...</span>';
      statusDiv.classList.remove('d-none', 'alert-danger', 'alert-success');
      statusDiv.classList.add('alert', 'alert-warning');

      // Kumpulkan data form dan format untuk doPost
      const tanggalWaktu = new Date(document.getElementById('tanggalWaktu').value).toISOString();
      const selectedCustomerId = document.getElementById('namaPelanggan').value;
      const gasBeli = document.getElementById('gasBeli').value;
      const tabungKembali = document.getElementById('tabungKembali').value;
      const uangBayar = document.getElementById('uangBayar').value;

      // Final Konfirmasi (Logika AppSheet: Tabung Kembali >= Gas Beli)
      if (parseInt(tabungKembali) < parseInt(gasBeli)) {
          statusDiv.innerHTML = "Jumlah Tabung Kembali tidak boleh kurang dari Gas Beli!";
          statusDiv.classList.remove('alert-warning');
          statusDiv.classList.add('alert-danger');
          return;
      }

      // Siapkan data untuk dikirim ke Google Sheets (Tepat Berurutan Kolom)
      const postData = {
        "sheet": "Transaksi", // Nama tab target
        "data": [
          document.getElementById('idTransaksi').value,
          tanggalWaktu,
          selectedCustomerId,
          gasBeli,
          tabungKembali,
          document.getElementById('totalTagihan').value,
          uangBayar,
          document.getElementById('hutangUang').value,
          "Ya", // Placeholder untuk Nota PDF Link
          "" // Placeholder untuk Sisa Tabung Dipinjam (bisa dihitung di sheets)
        ]
      };

      // Jalankan POST request (CRUD Master API)
      fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors', // Wajib untuk Apps Script POST
        cache: 'no-cache',
        headers: {
          'Content-Type': 'application/json'
        },
        redirect: 'follow',
        referrerPolicy: 'no-referrer',
        body: JSON.stringify(postData) 
      })
        .then(response => {
          // Asumsikan sukses (karena no-cors tidak bisa baca respon json)
          statusDiv.innerHTML = '<i class="fas fa-check-circle fa-2x d-block mb-2"></i> Transaksi Berhasil Disimpan!';
          statusDiv.classList.remove('alert-warning', 'alert-danger');
          statusDiv.classList.add('alert-success');

          // Update ID untuk transaksi berikutnya
          nextTransactionIdSuffix++;
          localStorage.setItem('gas_next_tx_id', nextTransactionIdSuffix);
          
          // Beri jeda 2 detik sebelum mereset form agar user bisa melihat feedback
          setTimeout(function(){ 
              resetForm();
              // Muat ulang daftar pelanggan agar saldo terupdate
              document.getElementById("btnLoad").click(); 
          }, 2000); 

        })
        .catch(error => {
          console.error('Error posting data:', error);
          statusDiv.innerHTML = '<i class="fas fa-exclamation-triangle fa-2x d-block mb-2"></i> Gagal menyimpan transaksi ke Google Sheets. Coba lagi.';
          statusDiv.classList.remove('alert-warning', 'alert-success');
          statusDiv.classList.add('alert-danger');
        });
    });

    // Tombol Batal
    document.getElementById('btnBatal').addEventListener('click', resetForm);
  </script>
</body>
</html>
