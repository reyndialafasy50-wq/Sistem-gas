<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Gas Saya</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <h2 class="text-center text-primary mb-4">Sistem Management Gas</h2>
    
    <div class="card shadow-sm border-0">
      <div class="card-body text-center">
        <h5 class="card-title text-secondary">Database Pelanggan</h5>
        <p class="text-muted small">Klik tombol di bawah untuk menarik data dari Google Sheets</p>
        <button id="btnLoad" class="btn btn-primary px-4 py-2">Muat Data Pelanggan</button>
      </div>
    </div>

    <div id="hasilData" class="mt-4 row"></div>
  </div>

  <script>
    // 1. MASUKKAN LINK URL APPS SCRIPT ANDA DI DALAM TANDA KUTIP DI BAWAH INI:
    const API_URL = "https://script.google.com/macros/s/AKfycbzE8T0osCFVPnxtU7p_Jt84UHydBun3hlV4tgm44Whbk_Xhmv7PGXRjE4b2oM63PV2SsA/exec"; 

    document.getElementById("btnLoad").addEventListener("click", function() {
      const hasilDiv = document.getElementById("hasilData");
      hasilDiv.innerHTML = "<p class='text-center text-warning'>Menghubungkan ke Database...</p>";

      // 2. Mengambil data dari Google Sheets
      fetch(API_URL + "?sheet=Pelanggan")
        .then(response => response.json())
        .then(data => {
          if(data.status === "success") {
            let htmlContent = "";
            data.data.forEach(pelanggan => {
              htmlContent += `
                <div class="col-md-4 mb-3">
                  <div class="card border-primary shadow-sm h-100">
                    <div class="card-body">
                      <h6 class="card-title text-primary">${pelanggan.Nama_Pelanggan || 'Tanpa Nama'}</h6>
                      <p class="card-text mb-1"><small>Kategori: <b>${pelanggan.Katagori || '-'}</b></small></p>
                      <p class="card-text"><small>Harga Khusus: Rp${pelanggan.Harga_Khusus || '-'}</small></p>
                    </div>
                  </div>
                </div>
              `;
            });
            hasilDiv.innerHTML = htmlContent;
          } else {
            hasilDiv.innerHTML = "<p class='text-center text-danger'>Gagal memuat data.</p>";
          }
        })
        .catch(error => {
          hasilDiv.innerHTML = "<p class='text-center text-danger'>Terjadi kesalahan koneksi.</p>";
        });
    });
  </script>
</body>
</html>
