<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Gas Ummi Nusa</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <style>
    body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, sans-serif; }
    .card-master { border-radius: 15px; border: none; margin-bottom: 20px; }
    .header-primary { background: linear-gradient(135deg, #007bff, #0056b3); color: white; border-radius: 15px 15px 0 0; }
    .header-success { background: linear-gradient(135deg, #198754, #146c43); color: white; border-radius: 15px 15px 0 0; }
    .form-control, .form-select { border-radius: 10px; padding: 10px; }
    
    @media print {
      body * { visibility: hidden; }
      #areaStruk, #areaStruk * { visibility: visible; }
      #areaStruk { 
        position: fixed; left: 0; top: 0; width: 80mm; margin: 0; padding: 0; box-shadow: none !important; border: none !important; 
      }
    }
  </style>
</head>
<body>

  <div class="container mt-4 mb-5">
    <h2 class="text-center text-primary mb-4 fw-bold"><i class="fas fa-gas-pump me-2"></i>Toko Gas Ummi Nusa</h2>

    <div class="row">
      <!-- FORM TRANSAKSI -->
      <div class="col-lg-6">
        <div class="card card-master shadow-lg">
          <div class="card-header header-primary py-3 text-center">
            <h5 class="mb-0 fw-bold">Input Transaksi Baru</h5>
          </div>
          <div class="card-body p-4 bg-white">
            <form id="formTransaksi">
              <div class="row mb-3">
                <div class="col-6">
                  <label class="small fw-bold text-muted">ID Transaksi</label>
                  <input type="text" class="form-control bg-light" id="idTransaksi" readonly>
                </div>
                <div class="col-6">
                  <label class="small fw-bold text-muted">Waktu</label>
                  <input type="text" class="form-control bg-light" id="waktuDisplay" readonly>
                </div>
              </div>

              <div class="mb-3">
                <label class="fw-bold">Pilih Pelanggan</label>
                <select class="form-select form-select-lg border-primary" id="namaPelanggan" required>
                  <option value="">-- Cari Nama --</option>
                </select>
              </div>

              <div class="row mb-3">
                <div class="col-6">
                  <label class="small fw-bold">Gas Beli (Tabung)</label>
                  <input type="number" class="form-control form-control-lg border-primary" id="gasBeli" required min="1" placeholder="0">
                </div>
                <div class="col-6">
                  <label class="small fw-bold text-info">Tabung Kosong Bawa</label>
                  <input type="number" class="form-control form-control-lg border-info" id="tabungKembali" required min="0" placeholder="0">
                </div>
              </div>

              <div class="row mb-4">
                <div class="col-4">
                  <label class="small fw-bold text-success">Tagihan (Rp)</label>
                  <input type="number" class="form-control fw-bold text-success bg-light" id="totalTagihan" readonly>
                </div>
                <div class="col-4">
                  <label class="small fw-bold">Bayar (Rp)</label>
                  <input type="number" class="form-control border-warning" id="uangBayar" required placeholder="0">
                </div>
                <div class="col-4">
                  <label class="small fw-bold text-danger">Hutang (Rp)</label>
                  <input type="number" class="form-control fw-bold text-danger bg-light" id="hutangUang" readonly>
                </div>
              </div>

              <div class="d-grid">
                <button type="submit" id="btnSimpan" class="btn btn-primary btn-lg fw-bold py-3">
                  <i class="fas fa-save me-2"></i>SIMPAN & LIHAT NOTA
                </button>
              </div>
            </form>
            <div id="statusTransaksi" class="mt-3 text-center d-none"></div>
          </div>
        </div>
      </div>

      <!-- RIWAYAT TRANSAKSI -->
      <div class="col-lg-6">
        <div class="card card-master shadow-lg">
          <div class="card-header header-success py-3 text-center">
            <h5 class="mb-0 fw-bold">Riwayat Transaksi Terakhir</h5>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover mb-0">
                <thead class="table-light">
                  <tr>
                    <th class="small">Pelanggan</th>
                    <th class="small">Total</th>
                    <th class="small">Aksi</th>
                  </tr>
                </thead>
                <tbody id="tabelRiwayat">
                  <!-- Data otomatis masuk -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL PREVIEW STRUK -->
  <div class="modal fade" id="modalStruk" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header bg-dark text-white py-2">
          <h6 class="modal-title"><i class="fas fa-receipt me-2"></i>Preview Struk</h6>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        
        <div class="modal-body d-flex justify-content-center bg-light">
          <!-- AREA INI YANG AKAN DIFOTO JADI JPG -->
          <div id="areaStruk" class="bg-white p-3 shadow-sm border" style="width: 270px; font-family: 'Courier New', Courier, monospace; color: black; line-height: 1.4;">
             <!-- KONTEN STRUK AKAN DIMASUKKAN OLEH JAVASCRIPT -->
          </div>
        </div>
        
        <div class="modal-footer justify-content-center bg-light">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Tutup</button>
          <button type="button" class="btn btn-primary btn-sm px-3" id="btnCetak"><i class="fas fa-print me-1"></i>Cetak</button>
          <button type="button" class="btn btn-success btn-sm px-3" id="btnBagikan"><i class="fab fa-whatsapp me-1"></i>Bagikan (JPG)</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzE8T0osCFVPnxtU7p_Jt84UHydBun3hlV4tgm44Whbk_Xhmv7PGXRjE4b2oM63PV2SsA/exec";
    let customersData = [];
    let riwayatData = [];
    let nextId = localStorage.getItem('gas_id') || 1001;
    let modalInstance = null;

    // FUNGSI MEMBUAT FORMAT TANGGAL 26/04/26, 10.36
    function formatTanggalPendek(dateObj) {
      const dd = String(dateObj.getDate()).padStart(2, '0');
      const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
      const yy = String(dateObj.getFullYear()).slice(-2);
      const h = String(dateObj.getHours()).padStart(2, '0');
      const m = String(dateObj.getMinutes()).padStart(2, '0');
      return `${dd}/${mm}/${yy}, ${h}.${m}`;
    }

    function resetForm() {
      document.getElementById('formTransaksi').reset();
      const now = new Date();
      
      // Terapkan format tanggal khusus
      document.getElementById('waktuDisplay').value = formatTanggalPendek(now);
      
      // Terapkan format ID Khusus: TX_YYMMDD_XXXX
      const yy = String(now.getFullYear()).slice(-2);
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      document.getElementById('idTransaksi').value = `TX_${yy}${mm}${dd}_${nextId}`;
      
      document.getElementById('statusTransaksi').classList.add('d-none');
    }

    function hitung() {
      const nama = document.getElementById('namaPelanggan').value;
      const beli = parseInt(document.getElementById('gasBeli').value) || 0;
      const bayar = parseInt(document.getElementById('uangBayar').value) || 0;
      
      const p = customersData.find(c => c.Nama_Pelanggan === nama);
      const harga = p ? p.Harga_Khusus : 0;
      
      const total = harga * beli;
      document.getElementById('totalTagihan').value = total;
      document.getElementById('hutangUang').value = Math.max(0, total - bayar);
    }

    document.getElementById('gasBeli').addEventListener('input', hitung);
    document.getElementById('uangBayar').addEventListener('input', hitung);
    document.getElementById('namaPelanggan').addEventListener('change', hitung);

    window.onload = function() {
      resetForm();
      modalInstance = new bootstrap.Modal(document.getElementById('modalStruk'));
      
      fetch(API_URL + "?sheet=Pelanggan")
        .then(r => r.json())
        .then(data => {
          customersData = data.data;
          const select = document.getElementById('namaPelanggan');
          data.data.forEach(p => {
            if(p.Nama_Pelanggan) {
              let opt = document.createElement('option');
              opt.value = p.Nama_Pelanggan;
              opt.text = p.Nama_Pelanggan;
              select.add(opt);
            }
          });
        });
      loadRiwayat();
    };

    function loadRiwayat() {
      fetch(API_URL + "?sheet=Transaksi")
        .then(r => r.json())
        .then(res => {
          riwayatData = res.data;
          const tbody = document.getElementById('tabelRiwayat');
          tbody.innerHTML = "";
          const last5 = res.data.reverse().slice(0, 5);
          last5.forEach(t => {
            tbody.innerHTML += `
              <tr>
                <td><b class="text-primary">${t.Nama_Pelanggan}</b><br><small class="text-muted">${t.ID_Transaksi}</small></td>
                <td class="fw-bold">Rp${Number(t.Total_Tagihan).toLocaleString('id-ID')}</td>
                <td><button onclick="cetakDariRiwayat('${t.ID_Transaksi}')" class="btn btn-sm btn-outline-primary"><i class="fas fa-eye"></i></button></td>
              </tr>
            `;
          });
        });
    }

    // MEMBANGUN TAMPILAN STRUK DENGAN DESAIN GARIS RAPI (Tanpa =====)
    function tampilkanStruk(record) {
      const hargaSatuan = (record[3] > 0) ? (record[5] / record[3]) : 0;
      const tanggalFormat = document.getElementById('waktuDisplay').value;

      const konten = `
        <div class="text-center mb-2">
          <strong style="font-size: 14px;">Toko Gas Ummi Nusa</strong><br>
          <span style="font-size: 11px;">Jl. Bandingan wates, Rt.08/04 Kec. Kejobong<br>
          Kab. Purbalingga - Jawa Tengah<br>
          Telp: 085713967119</span>
        </div>
        
        <div style="border-top: 1px dashed #000; margin: 8px 0;"></div>
        
        <table style="width: 100%; font-size: 11px;">
          <tr><td style="width: 40%; vertical-align: top;">No. Transaksi</td><td style="width: 5%; vertical-align: top;">:</td><td>${record[0]}</td></tr>
          <tr><td style="vertical-align: top;">Tanggal</td><td style="vertical-align: top;">:</td><td>${tanggalFormat}</td></tr>
          <tr><td style="vertical-align: top;">Pelanggan</td><td style="vertical-align: top;">:</td><td>${record[2]}</td></tr>
        </table>

        <div style="border-top: 1px dashed #000; margin: 8px 0;"></div>
        
        <div style="font-size: 11px;">
          <div>ITEM:</div>
          <div>Gas LPG 3Kg</div>
          <div>${record[3]} Tabung x Rp${hargaSatuan.toLocaleString('id-ID')}</div>
        </div>
        
        <div style="border-top: 1px dotted #000; margin: 8px 0;"></div>
        
        <table style="width: 100%; font-size: 11px; font-weight: bold;">
          <tr><td style="width: 45%;">TOTAL TAGIHAN</td><td style="width: 5%;">:</td><td>Rp${Number(record[5]).toLocaleString('id-ID')}</td></tr>
          <tr><td>UANG BAYAR</td><td>:</td><td>Rp${Number(record[6]).toLocaleString('id-ID')}</td></tr>
        </table>

        <div style="border-top: 1px dashed #000; margin: 8px 0;"></div>
        
        <div style="font-size: 11px;">
          <div>RINCIAN TABUNG:</div>
          <div>Bawa Tabung Kosong : ${record[4]} Tabung</div>
          <br>
          <div>SISA TUNGGAKAN SAAT INI:</div>
          <table style="width: 100%; font-size: 11px;">
            <tr><td style="width: 45%;">Hutang Uang</td><td style="width: 5%;">:</td><td>Rp${Number(record[7]).toLocaleString('id-ID')}</td></tr>
            <tr><td>Pinjam Tabung</td><td>:</td><td>${record[9]} Tabung</td></tr>
          </table>
        </div>

        <div style="border-top: 1px dashed #000; margin: 8px 0;"></div>
        
        <div class="text-center" style="font-size: 10px;">
          Terima Kasih Telah Berbelanja<br>
          Simpan Struk Ini Bukti Pembayaran
        </div>
      `;
      document.getElementById('areaStruk').innerHTML = konten;
      modalInstance.show();
    }

    // FUNGSI MELIHAT STRUK DARI RIWAYAT
    function cetakDariRiwayat(idTx) {
       const tx = riwayatData.find(x => x.ID_Transaksi === idTx);
       if(tx) {
          const pinjamTabung = Math.max(0, parseInt(tx.Gas_Beli) - parseInt(tx.Tabung_Kembali));
          const record = [
             tx.ID_Transaksi, tx.Tanggal_Waktu, tx.Nama_Pelanggan, tx.Gas_Beli, 
             tx.Tabung_Kembali, tx.Total_Tagihan, tx.Uang_Bayar, tx.Hutang_Uang, "YA", pinjamTabung
          ];
          
          // Set sementara jam display agar struk sesuai jam riwayat
          document.getElementById('waktuDisplay').value = formatTanggalPendek(new Date(tx.Tanggal_Waktu));
          tampilkanStruk(record);
       }
    }

    // SIMPAN TRANSAKSI
    document.getElementById('formTransaksi').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSimpan');
      const status = document.getElementById('statusTransaksi');
      
      btn.disabled = true;
      status.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
      status.className = "alert alert-warning mt-3";
      status.classList.remove('d-none');

      const gasBeli = parseInt(document.getElementById('gasBeli').value) || 0;
      const tabungKembali = parseInt(document.getElementById('tabungKembali').value) || 0;
      const pinjamTabung = Math.max(0, gasBeli - tabungKembali);

      const dataRecord = [
        document.getElementById('idTransaksi').value,
        new Date().toISOString(),
        document.getElementById('namaPelanggan').value,
        gasBeli,
        tabungKembali,
        document.getElementById('totalTagihan').value,
        document.getElementById('uangBayar').value,
        document.getElementById('hutangUang').value,
        "YA",
        pinjamTabung
      ];

      fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify({"sheet": "Transaksi", "data": dataRecord})
      }).then(() => {
        status.innerHTML = "Berhasil Disimpan!";
        status.className = "alert alert-success mt-3";
        nextId++;
        localStorage.setItem('gas_id', nextId);
        
        tampilkanStruk(dataRecord);
        
        setTimeout(() => {
          resetForm();
          btn.disabled = false;
          loadRiwayat();
        }, 1500);
      });
    });

    // TOMBOL CETAK (PRINT)
    document.getElementById('btnCetak').addEventListener('click', function() {
      window.print();
    });

    // TOMBOL BAGIKAN VIA WHATSAPP (JPG)
    document.getElementById('btnBagikan').addEventListener('click', function() {
      const btn = this;
      const teksAsli = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Memproses...';
      btn.disabled = true;

      const areaStruk = document.getElementById('areaStruk');
      
      html2canvas(areaStruk, { scale: 2 }).then(canvas => {
        canvas.toBlob(function(blob) {
          const fileGambar = new File([blob], 'Struk_Gas.jpg', { type: 'image/jpeg' });
          
          if (navigator.canShare && navigator.canShare({ files: [fileGambar] })) {
            navigator.share({
              files: [fileGambar],
              title: 'Struk Transaksi Pangkalan Gas'
            }).then(() => {
              btn.innerHTML = teksAsli;
              btn.disabled = false;
            }).catch(err => {
              btn.innerHTML = teksAsli;
              btn.disabled = false;
            });
          } else {
            alert('Fitur bagikan gambar tidak didukung. Coba lewat Safari.');
            btn.innerHTML = teksAsli;
            btn.disabled = false;
          }
        }, 'image/jpeg', 0.9);
      });
    });
  </script>
</body>
</html>
