<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Gas Pro V6</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <style>
    body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, sans-serif; }
    .card-master { border-radius: 15px; border: none; margin-bottom: 20px; }
    .header-primary { background: linear-gradient(135deg, #007bff, #0056b3); color: white; border-radius: 15px 15px 0 0; }
    .header-success { background: linear-gradient(135deg, #198754, #146c43); color: white; border-radius: 15px 15px 0 0; }
    .form-control, .form-select { border-radius: 10px; padding: 10px; }
    
    @media print {
      body * { visibility: hidden; }
      #areaStruk, #areaStruk * { visibility: visible; }
      #areaStruk { position: fixed; left: 0; top: 0; width: 80mm; margin: 0; padding: 10px; box-shadow: none !important; border: none !important; }
    }
  </style>
</head>
<body>

  <div class="container mt-4 mb-5">
    <h2 class="text-center text-primary mb-4 fw-bold"><i class="fas fa-gas-pump me-2"></i>Sistem Management Gas</h2>

    <div class="row">
      <div class="col-lg-6">
        <div class="card card-master shadow-lg">
          <div class="card-header header-primary py-3 text-center">
            <h5 class="mb-0 fw-bold">Input Transaksi Baru</h5>
          </div>
          <div class="card-body p-4 bg-white">
            <form id="formTransaksi">
              <div class="row mb-3">
                <div class="col-6">
                  <label class="small fw-bold text-muted">ID Transaksi</label>
                  <input type="text" class="form-control bg-light" id="idTransaksi" readonly>
                </div>
                <div class="col-6">
                  <label class="small fw-bold text-muted">Waktu</label>
                  <input type="text" class="form-control bg-light" id="waktuDisplay" readonly>
                </div>
              </div>

              <div class="mb-3">
                <label class="fw-bold">Pilih Pelanggan</label>
                <select class="form-select form-select-lg border-primary" id="namaPelanggan" required>
                  <option value="">-- Cari Nama --</option>
                </select>
              </div>

              <div class="row mb-3">
                <div class="col-6">
                  <label class="small fw-bold">Gas Beli</label>
                  <input type="number" class="form-control form-control-lg border-primary" id="gasBeli" required min="1" placeholder="0">
                </div>
                <div class="col-6">
                  <label class="small fw-bold text-success">Tagihan (Rp)</label>
                  <input type="number" class="form-control form-control-lg fw-bold text-success bg-light" id="totalTagihan" readonly>
                </div>
              </div>

              <div class="row mb-3">
                <div class="col-6">
                  <label class="small fw-bold text-secondary">Tabung Kembali</label>
                  <input type="number" class="form-control form-control-lg border-secondary" id="tabungKembali" required min="0" placeholder="0">
                </div>
                <div class="col-6">
                  <label class="small fw-bold text-info">Pinjam Tabung</label>
                  <input type="number" class="form-control form-control-lg fw-bold text-info bg-light" id="sisaTabung" readonly>
                </div>
              </div>

              <div class="row mb-4">
                <div class="col-6">
                  <label class="small fw-bold">Uang Bayar (Rp)</label>
                  <input type="number" class="form-control form-control-lg border-warning" id="uangBayar" required placeholder="0">
                </div>
                <div class="col-6">
                  <label class="small fw-bold text-danger">Hutang (Rp)</label>
                  <input type="number" class="form-control form-control-lg fw-bold text-danger bg-light" id="hutangUang" readonly>
                </div>
              </div>

              <div class="d-grid">
                <button type="submit" id="btnSimpan" class="btn btn-primary btn-lg fw-bold py-3">
                  <i class="fas fa-save me-2"></i>SIMPAN & LIHAT NOTA
                </button>
              </div>
            </form>
            <div id="statusTransaksi" class="mt-3 text-center d-none"></div>
          </div>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="card card-master shadow-lg">
          <div class="card-header header-success py-3 text-center">
            <h5 class="mb-0 fw-bold">Riwayat Transaksi Terakhir</h5>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover mb-0">
                <thead class="table-light">
                  <tr>
                    <th class="small">Pelanggan</th>
                    <th class="small">Total</th>
                    <th class="small">Aksi</th>
                  </tr>
                </thead>
                <tbody id="tabelRiwayat"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modalStruk" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 320px;">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header bg-dark text-white py-2">
          <h6 class="modal-title"><i class="fas fa-receipt me-2"></i>Preview Struk</h6>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body d-flex justify-content-center bg-light">
          <div id="areaStruk" class="bg-white p-3 shadow-sm border" style="width: 100%; color: black;"></div>
        </div>
        <div class="modal-footer justify-content-center bg-light">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Tutup</button>
          <button type="button" class="btn btn-primary btn-sm px-3" id="btnCetak"><i class="fas fa-print me-1"></i>Cetak</button>
          <button type="button" class="btn btn-success btn-sm px-3" id="btnBagikan"><i class="fab fa-whatsapp me-1"></i>Bagikan (JPG)</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzE8T0osCFVPnxtU7p_Jt84UHydBun3hlV4tgm44Whbk_Xhmv7PGXRjE4b2oM63PV2SsA/exec";
    let customersData = [];
    let nextId = localStorage.getItem('gas_id') || 1001;
    let modalInstance = null;

    function resetForm() {
      document.getElementById('formTransaksi').reset();
      const now = new Date();
      const pad = (n) => n < 10 ? '0' + n : n;
      const tglFormatted = `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}, ${pad(now.getHours())}.${pad(now.getMinutes())}`;
      
      document.getElementById('waktuDisplay').value = tglFormatted;
      document.getElementById('idTransaksi').value = "TX_" + now.getFullYear() + pad(now.getMonth()+1) + pad(now.getDate()) + "_" + nextId;
      document.getElementById('statusTransaksi').classList.add('d-none');
    }

    function hitung() {
      const nama = document.getElementById('namaPelanggan').value;
      const beli = parseInt(document.getElementById('gasBeli').value) || 0;
      const kembali = parseInt(document.getElementById('tabungKembali').value) || 0;
      const bayar = parseInt(document.getElementById('uangBayar').value) || 0;
      
      const p = customersData.find(c => c.Nama_Pelanggan === nama);
      const harga = p ? p.Harga_Khusus : 0;
      
      const total = harga * beli;
      document.getElementById('totalTagihan').value = total;
      
      // Hitung Hutang Uang
      document.getElementById('hutangUang').value = Math.max(0, total - bayar);
      
      // Hitung Pinjam Tabung
      document.getElementById('sisaTabung').value = Math.max(0, beli - kembali);
    }

    document.querySelectorAll('#gasBeli, #tabungKembali, #uangBayar, #namaPelanggan').forEach(el => {
      el.addEventListener('input', hitung);
    });

    window.onload = function() {
      resetForm();
      modalInstance = new bootstrap.Modal(document.getElementById('modalStruk'));
      
      fetch(API_URL + "?sheet=Pelanggan")
        .then(r => r.json())
        .then(data => {
          customersData = data.data;
          const select = document.getElementById('namaPelanggan');
          data.data.forEach(p => {
            if(p.Nama_Pelanggan) {
              let opt = document.createElement('option');
              opt.value = p.Nama_Pelanggan;
              opt.text = p.Nama_Pelanggan;
              select.add(opt);
            }
          });
        });
      loadRiwayat();
    };

    function loadRiwayat() {
      fetch(API_URL + "?sheet=Transaksi")
        .then(r => r.json())
        .then(res => {
          const tbody = document.getElementById('tabelRiwayat');
          tbody.innerHTML = "";
          const last5 = res.data.reverse().slice(0, 5);
          last5.forEach(t => {
            const tglAman = String(t.Tanggal_Waktu).replace(/'/g, "\\'");
            tbody.innerHTML += `
              <tr>
                <td><b class="text-primary">${t.Nama_Pelanggan}</b><br><small class="text-muted">${t.ID_Transaksi}</small></td>
                <td class="fw-bold">Rp${t.Total_Tagihan.toLocaleString('id-ID')}</td>
                <td><button onclick="tampilkanStruk('${t.ID_Transaksi}', '${tglAman}', '${t.Nama_Pelanggan}', ${t.Gas_Beli}, ${t.Tabung_Kembali}, ${t.Total_Tagihan}, ${t.Uang_Bayar})" class="btn btn-sm btn-outline-primary"><i class="fas fa-eye"></i></button></td>
              </tr>
            `;
          });
        });
    }

    // FUNGSI MERAKIT STRUK UMMI NUSA
    function tampilkanStruk(idTx, tglStr, nama, jmlBeli, jmlKembali, total, bayar) {
      const p = customersData.find(c => c.Nama_Pelanggan === nama);
      const hargaSatuan = p ? p.Harga_Khusus : (jmlBeli > 0 ? total/jmlBeli : 0);
      
      // Ambil sisa/hutang dari data transaksi yang diinput ini
      const sisaHutang = total > bayar ? total - bayar : 0;
      const sisaTabung = jmlBeli > jmlKembali ? jmlBeli - jmlKembali : 0;

      const konten = `
        <div style="font-family: monospace; font-size: 13px; line-height: 1.5; color: black;">
          <div style="text-align: center;">
            <b style="font-size: 15px;">Toko Gas Ummi Nusa</b><br>
            <span style="font-size: 11px;">Jl. Bandingan wates, Rt.08/04 Kec. Kejobong<br>Kab. Purbalingga - Jawa Tengah<br>Telp: 085713967119</span>
          </div>
          <div>====================================</div>
          <div style="display: flex;">
            <div style="width: 115px;">No. Transaksi</div><div>: ${idTx}</div>
          </div>
          <div style="display: flex;">
            <div style="width: 115px;">Tanggal</div><div>: ${tglStr}</div>
          </div>
          <div style="display: flex;">
            <div style="width: 115px;">Pelanggan</div><div>: ${nama}</div>
          </div>
          <div>====================================</div>
          <div>ITEM:</div>
          <div>Gas LPG 3Kg</div>
          <div>${jmlBeli} Tabung x Rp${hargaSatuan.toLocaleString('id-ID')}</div>
          <div>------------------------------------</div>
          <div style="display: flex; font-weight: bold;">
            <div style="width: 130px;">TOTAL TAGIHAN</div><div>: Rp${total.toLocaleString('id-ID')}</div>
          </div>
          <div style="display: flex;">
            <div style="width: 130px;">UANG BAYAR</div><div>: Rp${bayar.toLocaleString('id-ID')}</div>
          </div>
          <div>====================================</div>
          <div>RINCIAN TABUNG:</div>
          <div>Bawa Tabung Kosong : ${jmlKembali} Tabung</div>
          <br>
          <div>SISA TUNGGAKAN SAAT INI:</div>
          <div style="display: flex;">
            <div style="width: 130px;">Hutang Uang</div><div>: Rp${sisaHutang.toLocaleString('id-ID')}</div>
          </div>
          <div style="display: flex;">
            <div style="width: 130px;">Pinjam Tabung</div><div>: ${sisaTabung} Tabung</div>
          </div>
          <div>====================================</div>
          <div style="text-align: center; font-size: 12px; margin-top: 10px; line-height: 1.3;">
            Terima Kasih Telah Berbelanja<br>
            Simpan Struk Ini Bukti<br>
            Pembayaran
          </div>
        </div>
      `;
      document.getElementById('areaStruk').innerHTML = konten;
      modalInstance.show();
    }

    document.getElementById('formTransaksi').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSimpan');
      const status = document.getElementById('statusTransaksi');
      
      btn.disabled = true;
      status.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
      status.className = "alert alert-warning mt-3";
      status.classList.remove('d-none');

      const valId = document.getElementById('idTransaksi').value;
      const valWaktu = document.getElementById('waktuDisplay').value;
      const valNama = document.getElementById('namaPelanggan').value;
      const valBeli = parseInt(document.getElementById('gasBeli').value) || 0;
      const valKembali = parseInt(document.getElementById('tabungKembali').value) || 0;
      const valTotal = parseInt(document.getElementById('totalTagihan').value) || 0;
      const valBayar = parseInt(document.getElementById('uangBayar').value) || 0;
      const valHutang = parseInt(document.getElementById('hutangUang').value) || 0;
      const valSisaTabung = parseInt(document.getElementById('sisaTabung').value) || 0;

      // Data dikirim ke Sheets (Kolom A s/d J)
      const dataRecord = [
        valId, valWaktu, valNama, valBeli, valKembali, valTotal, valBayar, valHutang, "YA", valSisaTabung
      ];

      fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify({"sheet": "Transaksi", "data": dataRecord})
      }).then(() => {
        status.innerHTML = "Berhasil Disimpan!";
        status.className = "alert alert-success mt-3";
        nextId++;
        localStorage.setItem('gas_id', nextId);
        
        tampilkanStruk(valId, valWaktu, valNama, valBeli, valKembali, valTotal, valBayar);
        
        setTimeout(() => {
          resetForm();
          btn.disabled = false;
          loadRiwayat();
        }, 1500);
      });
    });

    document.getElementById('btnCetak').addEventListener('click', function() { window.print(); });

    document.getElementById('btnBagikan').addEventListener('click', function() {
      const btn = this;
      const teksAsli = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Memproses...';
      btn.disabled = true;

      const areaStruk = document.getElementById('areaStruk');
      html2canvas(areaStruk, { scale: 3, backgroundColor: "#ffffff" }).then(canvas => {
        canvas.toBlob(function(blob) {
          const fileGambar = new File([blob], 'Struk_Gas_Ummi_Nusa.jpg', { type: 'image/jpeg' });
          if (navigator.canShare && navigator.canShare({ files: [fileGambar] })) {
            navigator.share({
              files: [fileGambar],
              title: 'Struk Toko Gas Ummi Nusa'
            }).then(() => {
              btn.innerHTML = teksAsli; btn.disabled = false;
            }).catch(err => {
              btn.innerHTML = teksAsli; btn.disabled = false;
            });
          } else {
            alert('Fitur bagikan gambar tidak didukung. Anda bisa Screenshot manual struk ini.');
            btn.innerHTML = teksAsli; btn.disabled = false;
          }
        }, 'image/jpeg', 0.95);
      });
    });
  </script>
</body>
</html>
